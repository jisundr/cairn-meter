name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin (strict)
        run: claude plugin validate . --strict
      - name: Tests
        run: |
          pip install pytest
          python -m pytest
      - name: Hook selftests
        run: |
          for s in hooks/*.sh; do
            "$s" --selftest
          done
      - name: Frontend build and unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Built frontend matches the committed static/
        run: |
          if [ -n "$(git status --porcelain static)" ]; then
            git status --short static
            echo "static/ is out of sync with the build (changed or untracked files)" >&2
            exit 1
          fi
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Frontend e2e
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
